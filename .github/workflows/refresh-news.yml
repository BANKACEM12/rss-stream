# Refresh news every 30 minutes without any backend:
# 1. Run the static ingest (writes src/data/articles.json)
# 2. Commit + push if it changed -> Lovable auto-redeploys from the push
name: Refresh news

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ingest RSS feeds
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/ingest.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add src/data/
          git diff --cached --quiet || (git commit -m "📰 refresh news $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git push)
